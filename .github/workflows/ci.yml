name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: x86_64-unknown-none
          components: rust-src, llvm-tools-preview, rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build OS and kernel
        run: cargo build --release -p orbit-os
